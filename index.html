        border-radius: 50%;

        font-size: 13px;
        font-weight: 600;
        margin-top: -12px;
      }
      @keyframes kb-pulse {
        0% { opacity: 0.9; transform: scale(1); }
        100% { opacity: 0; transform: scale(2.6); }
