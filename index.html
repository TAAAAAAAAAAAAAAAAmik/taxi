    <style id="kinetix-boot-style">
      body { background: #F3F7F2; }
      #kinetix-boot {
        align-items: center;
        background: #F3F7F2;
        display: flex;
        flex-direction: column;
        inset: 0;
        justify-content: center;
        overflow: hidden;
        position: fixed;
        z-index: 9999;
      }
      #kinetix-boot .kb-scene {
        height: 100%;
        left: 0;
        position: absolute;
        top: 0;
        width: 100%;
      }
      #kinetix-boot .kb-content {
        align-items: center;
        display: flex;
        flex-direction: column;
        position: relative;
        animation: kb-enter 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes kb-enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #kinetix-boot .kb-badge-wrap {
        align-items: center;
        display: flex;
        height: 82px;
        justify-content: center;
        margin-bottom: 26px;
        position: relative;
        width: 82px;
      }
      #kinetix-boot .kb-badge-wrap::before {
        background: rgba(0, 141, 73, 0.12);
        border-radius: 50%;
        content: '';
        height: 150px;
        position: absolute;
        width: 150px;
        z-index: -1;
        animation: kb-breathe 4s ease-in-out infinite;
      }
      @keyframes kb-breathe {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      #kinetix-boot .kb-radar {
        border: 1.5px solid rgba(0, 141, 73, 0.32);
        border-radius: 50%;
        height: 82px;
        position: absolute;
        width: 82px;
        animation: kb-radar 3.6s ease-in-out infinite;
      }
      #kinetix-boot .kb-radar.r2 { animation-delay: 1.2s; }
      #kinetix-boot .kb-radar.r3 { animation-delay: 2.4s; }
      @keyframes kb-radar {
        0% { opacity: 0; transform: scale(0.75); }
        20% { opacity: 0.32; }
        75% { opacity: 0.1; }
        100% { opacity: 0; transform: scale(3); }
      }
      #kinetix-boot .kb-badge {
        align-items: center;
        background: #008D49;
        border-radius: 22px;
        box-shadow: 0 10px 20px rgba(0, 111, 58, 0.34);
        display: flex;
        height: 74px;
        justify-content: center;
        overflow: hidden;
        position: relative;
        width: 74px;
      }
      #kinetix-boot .kb-badge::before {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 50%;
        content: '';
        height: 60px;
        left: -6px;
        position: absolute;
        top: -34px;
        width: 86px;
      }
      #kinetix-boot .kb-brand {
        color: #12382C;
        font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
        font-size: 33px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      #kinetix-boot .kb-sub {
        color: #6E8579;
        font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3.4px;
        margin-top: 9px;
      }
      @media (prefers-reduced-motion: reduce) {
        #kinetix-boot .kb-badge-wrap::before,
        #kinetix-boot .kb-radar { animation: none; }
        #kinetix-boot .kb-radar { opacity: 0; }
      }
